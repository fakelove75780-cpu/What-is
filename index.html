<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Settings Shortcut</title>
    <style>
        .settings-btn {
            background-color: #007bff;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .settings-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h2>Phone Settings သို့သွားရန် ခလုတ်</h2>
    
    <!-- One-Click Button -->
    <button class="settings-btn" onclick="openPhoneSettings()">
        ⚙️ Open Phone Settings
    </button>

    <script>
        function openPhoneSettings() {
            // Android Intent Scheme ဖြင့် ဖုန်း Settings သို့ ညွှန်းခြင်း
            const androidIntent = "intent://com.android.settings/#Intent;scheme=android-app;end";
            
            // iOS Custom Scheme (iOS အဟောင်းများတွင်သာ အလုပ်လုပ်နိုင်သည်)
            const iosScheme = "App-Prefs:root=SETTINGS";

            const isAndroid = /Android/i.test(navigator.userAgent);
            const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

            if (isAndroid) {
                window.location.href = androidIntent;
            } else if (isIOS) {
                window.location.href = iosScheme;
            } else {
                alert("ကျေးဇူးပြု၍ Mobile Device (ဖုန်း) တွင် အသုံးပြုပေးပါ။");
            }
        }
    </script>

</body>
</html>
